<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540"
  role="img" aria-label="Excerpt from the June 2, 2025 ATRS Investment Committee meeting transcript: a trustee stating 'I do have a problem with the procedure'">
  <title>Trustee dissent transcript</title>
  <defs>
    <linearGradient id="hero-fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#013237" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#013237" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#013237" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="540" fill="url(#hero-fade)"/>
  <!-- file header strip -->
  <g font-family="IBM Plex Mono, monospace" font-size="14"
     fill="#E6F9E4" opacity="0.55">
    <text x="80" y="60">SOURCE  20250602B_IC.transcript.txt</text>
    <text x="80" y="82">FOIA    ATRS production, 2026-02-28 (Request 1, Board Meetings)</text>
    <text x="80" y="104">SPEAKER ATRS Board of Trustees, Investment Committee</text>
    <text x="80" y="126">DATE    2025-06-02</text>
  </g>
  <!-- horizontal rule -->
  <line x1="80" y1="160" x2="1520" y2="160" stroke="#E6F9E4"
        stroke-width="1" opacity="0.25"/>
  <!-- the cropped transcript lines (issuer-neutral) -->
  <g font-family="IBM Plex Mono, monospace" font-size="22" fill="#E6F9E4"
     opacity="0.78">
    <text x="80" y="220">[00:37:39.000 --&gt; 00:37:41.000]  but I do have a problem</text>
    <text x="80" y="260">[00:37:41.000 --&gt; 00:37:43.000]  with the procedure</text>
  </g>
  <!-- subtle highlight bar behind the operative phrase -->
  <rect x="76" y="237" width="540" height="34" fill="#1E7B47" opacity="0.18" rx="3"/>
  <!-- ellipsis tail to show the transcript continues -->
  <g font-family="IBM Plex Mono, monospace" font-size="22" fill="#E6F9E4"
     opacity="0.35">
    <text x="80" y="312">[00:37:43.000 --&gt; 00:37:45.000]  that we are starting here…</text>
  </g>
  <!-- footer attribution -->
  <text x="80" y="500" font-family="Inter, system-ui, sans-serif"
        font-size="12" letter-spacing="2" fill="#E6F9E4" opacity="0.5">
    PUBLIC RECORD — TRUSTEE DISSENT, JUNE 2, 2025
  </text>
</svg>
