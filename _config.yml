title: Arkansans for Pension Integrity
description: "Arkansas directed $115 million into Israel Bonds purchases and an ATRS manager account. Arkansans for Pension Integrity is fighting for a public financial case behind every covered pension decision."
url: "https://arpensions.org"
baseurl: ""
permalink: /:title/
locale: en_US

# Social / Open Graph defaults
twitter:
  card: summary_large_image
social:
  name: Arkansans for Pension Integrity

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  pages:
    output: true
    permalink: /:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# Exclude from build
exclude:
  - _internal
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - requirements-dev.txt
  - .github
