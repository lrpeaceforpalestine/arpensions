analysis_record:
  lead: >-
    The files contain manager-selection, implementation, marketability, and
    credit-related materials. They leave material questions about how
    sovereign-credit risk and portfolio fit were evaluated and connected to
    each affirmative investment decision.
  atrs: >-
    Aon’s two-page memorandum addresses implementation and manager selection.
    An S&P downgrade report also appears elsewhere in the production; the
    produced files do not establish that trustees received or relied on it for
    Resolution 2025-22.
  apers: >-
    The reviewed authorization file contains no Callan sovereign-credit
    memorandum tied to the decision.
  treasury: >-
    Treasury's internal overview recommends HOLD and continued surveillance.
    The settled May 2025 purchase is not accompanied by an identified written
    reconciliation.
  matrix:
    - institution: "ATRS"
      produced: >-
        Aon implementation and manager comparison, a Reams recommendation,
        marketability language, and an S&P downgrade report elsewhere in the production.
      question: >-
        How did trustees connect sovereign-credit and portfolio-fit evaluation
        to the invest-or-not decision, and what securities did Reams later acquire?
    - institution: "APERS"
      produced: >-
        Authorization records, seller materials, operational correspondence,
        the chief investment officer's FOIA-search email, and the October purchase record.
      question: >-
        What consultant or staff analysis supported the authorization, and how
        should the confirmed purchase be understood against the IFSC-authorized range?
    - institution: "State Treasury"
      produced: >-
        An internal overview summarizing downgrade concerns and recommending
        HOLD with continuing surveillance.
      question: >-
        What written analysis or authority reconciled the later settled purchase
        with the identified recommendation?

