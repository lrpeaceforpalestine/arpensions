legislation:
  name: "Pension Investment Integrity Act"
  session: "2027 Arkansas legislative session"
  stage: "Prefiling campaign proposal"
  bill_number: "Not assigned"
  sponsor_status: "No legislative sponsor announced"
  status_verified: "2026-07-16"
  brief_version_date: "2026-07-16"
  brief_pdf_url: "/assets/documents/pension-investment-integrity-act-brief-2026-07-16.pdf"
  cfc_status: >-
    According to Arkansans for Pension Integrity's June 27, 2026 convention
    record, Citizens First Congress delegates selected the proposal for the
    coalition's short-term 2027 priority platform.
  cfc_status_short: "Campaign-recorded CFC short-term priority"
  cfc_decision_date: "2026-06-27"
  cfc_url: "https://www.citizensfirst.org/"
  cfc_process_url: "https://www.citizensfirst.org/process"
  important_dates_url: >-
    https://www.arkleg.state.ar.us/Home/FTPDocument?path=%2Fassembly%2F2027%2FDocuments%2FSession_Important_Dates_2027.pdf
  prefiling_opens: "2026-11-16"
  prefiling_opens_display: "November 16, 2026"
  session_convenes: "2027-01-11"
  session_convenes_display: "January 11, 2027"
  retirement_filing_deadline: "2027-01-25"
  retirement_filing_deadline_display: "January 25, 2027"
  late_filing_rule: >-
    After the ordinary retirement-legislation filing deadline, introduction
    requires a three-fourths vote of the full membership of each chamber.
  pre_acquisition_summary: >-
    Before acquisition, covered pension systems would prepare a written credit
    analysis, compare reasonably available alternatives, disclose liquidity and
    transfer limits, and make a written pecuniary-factor fiduciary determination.
  publication_summary: >-
    The core analysis and fiduciary determination would be posted publicly
    within 30 days after each covered acquisition.
  full_summary: >-
    Before acquisition, covered pension systems would prepare the analysis,
    comparison, liquidity disclosure, and fiduciary determination; the analysis
    and determination would be posted publicly within 30 days after each
    covered acquisition.
  publication_boundary: >-
    Publication would occur after the covered acquisition, not before trade
    execution. Bill text should allow only narrow, explained redactions for
    legally protected account, security, operational, or proprietary details;
    the required risk, return, liquidity, alternatives, and fiduciary
    conclusions should remain public.
  publication_public_fields:
    - "The covered asset class, amount, and acquisition date"
    - "The credit conclusion and material risks"
    - "The alternatives, expected-return, and liquidity comparison"
    - "The pecuniary-factor fiduciary determination"
    - "A written reason for each redaction"
  scope_note: >-
    The proposal is prospective and issuer-neutral. It would apply to covered
    Arkansas pension acquisitions of non-tradable sovereign debt and would not
    direct a trustee vote or reach the separately governed State Treasury.
  act_498_url: "https://www.arkleg.state.ar.us/Acts/FTPDocument?ddBienniumSession=2023%2F2023R&file=498.pdf&path=%2FACTS%2F2023R%2FPublic%2F"
  provisions:
    - "A written credit analysis prepared by pension staff or an independent adviser before acquisition"
    - "A written comparison of risk, return, and liquidity against reasonably available fixed-income alternatives"
    - "A plain-language disclosure of transfer restrictions and the absence of a secondary market"
    - "A written fiduciary determination connecting the decision to material financial risk and return"
    - "Public posting of the analysis and determination within 30 days after each covered acquisition"

