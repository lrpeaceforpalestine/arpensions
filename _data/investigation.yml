legislation:
  name: "Pension Investment Integrity Act"
  session: "2027 Arkansas legislative session"
  stage: "Prefiling campaign proposal"
  bill_number: "Not assigned"
  sponsor_status: "No legislative sponsor announced"
  status_verified: "2026-07-16"
  cfc_status: >-
    Selected by the Citizens First Congress as a short-term priority for the
    2027 legislative session.
  cfc_url: "https://www.citizensfirst.org/"
  cfc_process_url: "https://www.citizensfirst.org/process"
  pre_acquisition_summary: >-
    Before acquisition, covered pension systems would prepare a written credit
    analysis, compare reasonably available alternatives, disclose liquidity and
    transfer limits, and make a written pecuniary-factor fiduciary determination.
  publication_summary: >-
    The analysis and fiduciary determination would be posted publicly within 30 days.
  full_summary: >-
    Before acquisition, covered pension systems would prepare the analysis,
    comparison, liquidity disclosure, and fiduciary determination; the analysis
    and determination would be posted publicly within 30 days.
  scope_note: >-
    The proposal is prospective and issuer-neutral. It would apply to covered
    Arkansas pension acquisitions of non-tradable sovereign debt and would not
    direct a trustee vote or reach the separately governed State Treasury.
  act_498_url: "https://www.arkleg.state.ar.us/Acts/FTPDocument?ddBienniumSession=2023%2F2023R&file=498.pdf&path=%2FACTS%2F2023R%2FPublic%2F"
  provisions:
    - "A written credit analysis prepared by pension staff or an independent adviser before acquisition"
    - "A written comparison of risk, return, and liquidity against reasonably available fixed-income alternatives"
    - "A plain-language disclosure of transfer restrictions and the absence of a secondary market"
    - "A written fiduciary determination connecting the decision to material financial risk and return"
    - "Public posting of the analysis and determination within 30 days"

