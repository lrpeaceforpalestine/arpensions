thesis:
  headline: "Public money deserves a public investment record."
  eyebrow: "Israel Bonds · Arkansas public investment record"
  homepage_summary: >-
    Arkansas records establish a $65 million Israel Bonds security-level floor
    across Treasury and APERS, plus $50 million funded to an ATRS manager mandate
    whose underlying holdings were not produced.
  summary: >-
    Arkansas records document $65 million in confirmed securities and another
    $50 million funded to an ATRS manager mandate. The decision files contain
    manager-selection, implementation, marketability, and credit-related
    materials while leaving material questions about how sovereign-credit risk
    and portfolio fit were evaluated and connected to each affirmative decision.

