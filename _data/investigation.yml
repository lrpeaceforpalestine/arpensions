analysis_record:
  lead: >-
    The files contain manager-selection, implementation, marketability, and
    credit-related materials. They leave material questions about how
    sovereign-credit risk and portfolio fit were evaluated and connected to
    each affirmative investment decision.
  atrs: >-
    Aon’s two-page memorandum addresses implementation and manager selection.
    An S&P downgrade report also appears elsewhere in the production; the
    produced files do not establish that trustees received or relied on it for
    Resolution 2025-22.
  apers: >-
    The reviewed authorization file contains no Callan sovereign-credit
    memorandum tied to the decision.
  treasury: >-
    Treasury's internal overview recommends HOLD and continued surveillance.
    The settled May 2025 purchase is not accompanied by an identified written
    reconciliation.
  matrix:
    - institution: "ATRS"
      produced: >-
        Aon implementation and manager comparison, a Reams recommendation,
        marketability language, and an S&P downgrade report elsewhere in the production.
      question: >-
        How did trustees connect sovereign-credit and portfolio-fit evaluation
        to the invest-or-not decision, and what securities did Reams later acquire?
    - institution: "APERS"
      produced: >-
        Authorization records, seller materials, operational correspondence,
        the chief investment officer's FOIA-search email, and the October purchase record.
      question: >-
        What consultant or staff analysis supported the authorization, and how
        should the confirmed purchase be understood against the IFSC-authorized range?
    - institution: "State Treasury"
      produced: >-
        An internal overview summarizing downgrade concerns and recommending
        HOLD with continuing surveillance.
      question: >-
        What written analysis or authority reconciled the later settled purchase
        with the identified recommendation?

status_labels:
  established: "Directly documented or arithmetically derived from documented transactions"
  funded_mandate: "Cash funded to a manager account; underlying securities are a separate question"
  authorization: "Permission or a ceiling; not evidence of a purchase, holding, or fully deployed amount"
  mixed_measure: "A clearly labeled combination of unlike measures; not a holdings total"
  conditional: "An operational step appears in the record, but completion is not documented"
  unproduced: "Not identified in the reviewed production; not a claim of universal absence"
  reported: "Described by a participant or seller without independent confirmation"
  interpretive: "An inference drawn from documented facts and labeled as such"

search_boundaries:
  atrs_merits:
    title: "ATRS decision-merits search"
    custodian: "Arkansas Teacher Retirement System"
    scope: >-
      The 517-page June 2, 2025 Board packet; the 402-page Investment Committee
      packet; BoardDocument.pdf; Reports.pdf; and Staff Emails1-5, covering
      October 23, 2024 through June 5, 2025, with later-produced variants
      reconciled.
    record_types: >-
      Board and committee packets, staff emails, consultant memoranda, the
      resolution, and a credit-rating report.
    method: >-
      Native-text and OCR search, full-page rendering, visual review of Aon
      packet pages 149-150 and the surrounding corpus, and duplicate
      reconciliation across investment, credit, rating, risk, return,
      liquidity, geopolitical-risk, and portfolio-fit terms.
    result: >-
      The files contain substantive manager advice and a separate S&P report.
      No identified consultant or staff memorandum connects sovereign-credit
      risk, expected return, liquidity, and portfolio fit to the affirmative
      authorization.
    limit: >-
      The production does not establish whether trustees received or relied on
      the S&P report and does not exclude oral or unproduced analysis.
  atrs_holdings:
    title: "ATRS mandate-holdings search"
    custodian: "Arkansas Teacher Retirement System; selected funding notice also produced by the Auditor of State"
    scope: >-
      Resolution 2025-22, the original and amended Reams agreement, Aon and
      Investment Guidelines, the December 29 funding notice, and related
      mandate records through the February 27, 2026 cutoff.
    record_types: >-
      Resolution, manager agreement and amendment, investment guidelines,
      funding email, and produced transaction or holdings records.
    method: >-
      Full inventory, text and OCR search, page rendering, and targeted review
      for CUSIP, purchase, settlement, holdings, valuation, monthly statement,
      transaction report, reconciliation, and deployment terms.
    result: >-
      No produced CUSIP-level purchase, holding, settlement, deployment, or
      reconciliation record was identified for the funded mandate.
    limit: >-
      This finding does not establish the account's cash balance, that no
      security was purchased, or that responsive records do not exist elsewhere.
  atrs_audio:
    title: "December 1 ATRS audio search"
    custodian: "Arkansas Teacher Retirement System"
    scope: >-
      20251201B_IC_Audio.m4a and 20251201D_BOT_Audio.m4a, approximately 188
      minutes represented by 2,966 locally generated transcript segments.
    record_types: "Original meeting audio and campaign-generated search transcripts."
    method: >-
      Transcript search for Israel Bonds, Reams, Scout, Jubilee, Resolution
      2025-22, and related variants, followed by targeted review against the
      original recordings.
    result: "No substantive topic match was identified in the reviewed transcripts and targeted audio passages."
    limit: >-
      Automated speech recognition is a locator aid. The result is not proof
      that every word was captured or that no relevant oral discussion occurred.
  apers_analysis:
    title: "APERS and Callan decision-analysis search"
    custodian: "Arkansas Public Employees Retirement System"
    scope: >-
      The 68-page May 15, 2025 IFSC packet; selected fourth-quarter 2024 and
      first-quarter 2025 Callan attachments totaling 836 pages, including 758
      APERS pages; selected post-vote packets and minutes through February 3,
      2026; and the February 13, 2026 chief investment officer FOIA-search email.
    record_types: >-
      Agenda, packet, signed minutes, quarterly consultant reports, post-vote
      packets and minutes, and the chief investment officer's search email.
    method: >-
      Full-render review and native-text or OCR searches that distinguished
      country and equity references to Israel from Israel Bonds and
      sovereign-credit analysis, followed by targeted review of the decision
      documents and search email.
    result: >-
      No Callan Israel Bonds or sovereign-credit memorandum tied to the May 15
      authorization was identified. The chief investment officer wrote that he
      prepared nothing for the Board and believed the consultants had not either.
    limit: "The reviewed files do not exclude oral, off-thread, or unproduced work."
  ashers_adoption:
    title: "ASHERS adoption search"
    custodian: "Arkansas State Highway Employees Retirement System"
    scope: >-
      All five files in the March 27, 2026 production, covering the April 16
      introduction and pitch through July 14, 2025 follow-up reporting.
    record_types: "Native email files and the attached eight-page seller presentation."
    method: >-
      Header, body, reply-chain, and attachment review; rendering of all deck
      pages; and searches for the participants, issuer, authorization,
      purchase, holding, meeting, call, and follow-up terms.
    result: >-
      No ASHERS reply, follow-up, Board action, or authorization was identified.
      Separate May 15 and July 14 messages affirmatively reported no holding or
      purchase at those dates.
    limit: >-
      The production does not prove oral silence, an affirmative decline, or
      the absence of records outside the selected release.

