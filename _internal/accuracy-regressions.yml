# Internal publication regression gate. This file is excluded from the Jekyll build.
# Patterns describe formulations that must never re-enter public site source or output.
regressions:
  - id: treasury_60m_confirmed
    pattern: '(?:Treasury.{0,80}\$60\s*(?:M|million)|\$60\s*(?:M|million).{0,80}Treasury)'
    note: "Treasury's additional payment is conditional; the confirmed derived floor is lower."
  - id: statewide_115m_holdings
    pattern: '(?:\$115\s*(?:M|million).{0,80}holdings|holdings.{0,80}\$115\s*(?:M|million))'
    note: "The combined figure mixes confirmed securities and ATRS manager funding."
  - id: zero_analysis
    pattern: '(?:zero|no) (?:independent )?(?:credit )?analys(?:is|es)'
    note: "Describe the produced analytical record affirmatively and bound the unresolved question."
  - id: aon_empty
    pattern: '(?:Aon.{0,80}(?:empty|blank|no body)|(?:empty|blank|no body).{0,80}Aon)'
    note: "Rendered page 149 contains substantive implementation and manager-selection advice."
  - id: atrs_full_deployment
    pattern: '(?:full|entire) \$50\s*(?:M|million).{0,80}(?:deployed|invested|purchased)'
    note: "The record documents manager funding, not the underlying security deployment."
  - id: ashers_decline
    pattern: 'ASHERS.{0,80}(?:declined|rejected|refused)'
    note: "The selected record shows a pitch and no identified adoption, not an affirmative decline."
  - id: auditor_no_formal_role
    pattern: "Auditor(?:'s)?(?: office)?.{0,100}no (?:formal )?(?:pension|board|investment) role"
    note: "The Auditor and proxy had formal board roles but did not manage pension assets."
  - id: all_room_230
    pattern: '(?:all|every).{0,80}(?:meeting|stop|encounter).{0,80}Room 230'
    note: "The eight scheduled stops span distinct venues."
  - id: white_confirmed
    pattern: '\bWhite (?:meeting|encounter).{0,60}\b(?:confirmed|established)\b'
    note: "The scheduled White encounter remains unconfirmed in the reviewed corpus."
  - id: lone_dissent
    pattern: '\b(?:lone|sole)\b.{0,30}\b(?:no|dissent)\b'
    note: "The produced recordings establish passage but not an individual vote tally."
  - id: self_correction_language
    pattern: '\b(?:correction|corrected|previously|retired claim|earlier account)\b'
    note: "Published pages present the current record without a retrospective self-audit."
  - id: not_zero_language
    pattern: '\bnot zero\b'
    note: "Published pages use affirmative evidence descriptions."
  - id: not_blank_language
    pattern: '\bnot characterized as (?:blank|empty)\b'
    note: "Published pages describe the rendered memorandum affirmatively."
  - id: pulley_hold_authorship
    pattern: 'Pulley.{0,80}(?:authored|wrote|prepared).{0,80}(?:October 2024|HOLD|overview)'
    note: "The internal Treasury overview is unattributed."
  - id: posting_mislabeled_preacquisition
    pattern: '(?:before (?:a |any )?(?:covered )?(?:pension )?acquisition.{0,120}public (?:posting|disclosure)|public (?:posting|disclosure).{0,120}before (?:a |any )?(?:covered )?(?:pension )?acquisition)'
    note: "Analysis occurs before acquisition; publication follows within 30 days."
  - id: apers_board_range
    pattern: 'APERS.{0,80}Board-approved range|Board-approved range.{0,80}APERS'
    note: "Use the documented IFSC authorization and bound later Board treatment."
  - id: action_network_source_drift
    pattern: 'source=widget'
    note: "Petition attribution uses the canonical arpensions source code."
  - id: wrong_public_repository
    pattern: 'arpensions\.org/blob'
    note: "The public repository is divestforARfuture/arpensions."
