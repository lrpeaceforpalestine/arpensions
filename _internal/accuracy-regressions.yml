# Internal publication regression gate. This file is excluded from the Jekyll build.
# Patterns describe formulations that must never re-enter public site source or output.
regressions:
  - id: treasury_60m_confirmed
    pattern: '(?:Treasury.{0,80}\$60\s*(?:M|million)|\$60\s*(?:M|million).{0,80}Treasury)'
    note: "Treasury's additional payment is conditional; the confirmed derived floor is lower."
  - id: statewide_115m_holdings
    pattern: '(?:\$115\s*(?:M|million)[^.!?\n]{0,80}holdings|holdings[^.!?\n]{0,80}\$115\s*(?:M|million))'
    note: "The combined figure mixes confirmed securities and ATRS manager funding."
  - id: zero_analysis
    pattern: '(?:zero|no) (?:independent )?(?:credit )?analys(?:is|es)'
    note: "Describe the produced analytical record affirmatively and bound the unresolved question."
  - id: aon_empty
    pattern: '(?:Aon(?:''s)?(?: memo| pages?)?.{0,40}(?:was|were|is|are|appeared|appears).{0,20}(?:empty|blank|without (?:a )?body)|(?:empty|blank|without (?:a )?body).{0,40}Aon(?:''s)?(?: memo| pages?)?)'
    note: "Rendered page 149 contains substantive implementation and manager-selection advice."
  - id: atrs_full_deployment
    pattern: '(?:full|entire) \$50\s*(?:M|million).{0,80}(?:deployed|invested|purchased)'
    note: "The record documents manager funding, not the underlying security deployment."
  - id: ashers_decline
    pattern: 'ASHERS.{0,80}(?:declined|rejected|refused)'
    note: "The selected record shows a pitch and no identified adoption, not an affirmative decline."
  - id: auditor_no_formal_role
    pattern: "Auditor(?:'s)?(?: office)?.{0,100}no (?:formal )?(?:pension|board|investment) role"
    note: "The Auditor and proxy had formal board roles but did not manage pension assets."
  - id: all_room_230
    pattern: '(?:all|every).{0,80}(?:meeting|stop|encounter).{0,80}Room 230'
    note: "The eight scheduled stops span distinct offices and settings."
  - id: white_confirmed
    pattern: '\bWhite (?:meeting|encounter).{0,60}\b(?:confirmed|established)\b'
    note: "The schedule does not establish that the White encounter occurred."
  - id: lone_dissent
    pattern: '\b(?:lone|sole)\b.{0,30}\b(?:no|dissent)\b'
    note: "The produced recordings establish passage but not an individual vote tally."
  - id: self_correction_language
    pattern: '\b(?:correction|corrected|previously|retired claim|earlier account)\b'
    note: "Published pages present the current record without a retrospective self-audit."
  - id: defensive_but_not
    pattern: '\bbut not\b'
    scope: rendered
    note: "Public campaign prose should state the action, consequence, or category directly."
  - id: records_do_not_show
    pattern: '\b(?:the|available|released|selected|produced) (?:agency |account |transaction )?(?:records|files|documents) (?:do|did) not\b'
    scope: rendered
    note: "Replace audit-style absence disclaimers with a direct public accountability statement."
  - id: aon_negation
    pattern: '\bAon.{0,100}(?:did not|does not|was not|is not|not advising)\b'
    scope: rendered
    note: "Describe Aon as responsible for implementation and trustees as responsible for the investment decision."
  - id: personal_role_negation
    pattern: '\bnot [A-Z][a-z]+ personally\b'
    scope: rendered
    note: "Name the official who acted and the formal capacity directly."
  - id: disclaimer_by_itself
    pattern: '\bdoes not,? by itself\b'
    scope: rendered
    note: "Public copy should state what a fact establishes and why it matters."
  - id: defensive_not_total
    pattern: '\b(?:is|are|was|were|it is|this is) not (?:a |an |the )?(?:holdings?|purchase|security-level|completed-purchase)\b'
    scope: rendered
    note: "State the figure's category affirmatively."
  - id: not_zero_language
    pattern: '\bnot zero\b'
    note: "Published pages use affirmative evidence descriptions."
  - id: not_blank_language
    pattern: '\bnot characterized as (?:blank|empty)\b'
    note: "Published pages describe the rendered memorandum affirmatively."
  - id: pulley_hold_authorship
    pattern: 'Pulley.{0,80}(?:authored|wrote|prepared).{0,80}(?:October 2024|HOLD|overview)'
    note: "The internal Treasury overview is unattributed."
  - id: posting_mislabeled_preacquisition
    pattern: 'public (?:posting|disclosure)[^.!?\n]{0,80}before (?:a |any )?(?:covered )?(?:pension )?acquisition'
    note: "Analysis occurs before acquisition; publication follows within 30 days."
  - id: apers_board_range
    pattern: 'APERS.{0,80}Board-approved range|Board-approved range.{0,80}APERS'
    note: "Use the documented IFSC authorization and bound later Board treatment."
  - id: action_network_source_drift
    pattern: 'source=widget'
    note: "Petition attribution uses the canonical arpensions source code."
  - id: wrong_public_repository
    pattern: 'arpensions\.org/blob'
    note: "Do not construct source links by appending repository paths to the campaign domain."
  - id: former_campaign_identity
    pattern: '(?:Little Rock Peace for Palestine|\bLRPP\b)'
    note: "Arkansans for Pension Integrity is the sole public campaign identity."
  - id: internal_research_jargon
    pattern: '(?:evidence corpus|PDF corpus|raw corpus|render gate|evidence baseline|search boundary|record boundary|evidence ledger|amount ledger|agency ledger)'
    scope: rendered
    note: "Public copy should speak directly to Arkansans, not describe an internal research system."
  - id: public_status_jargon
    pattern: '\b(?:unconfirmed|unproduced)\b'
    scope: rendered
    note: "Explain the limits of a claim in ordinary prose instead of publishing internal status labels."
  - id: treasury_target_unattributed
    pattern: '(?:Treasury.{0,80}(?:documented|established).{0,40}\$55\s*(?:M|million).{0,40}(?:target|authorization)|\$55\s*(?:M|million).{0,80}(?:Treasury|Huffman).{0,40}(?:target|authorization))'
    note: "The $55M target is seller-reported; the later statement establishes positions, not Huffman's instruction."
  - id: wrong_dci_representative
    pattern: '\bGail Young\b'
    note: "The relevant DCI representative is Brad or Bradley Young."
