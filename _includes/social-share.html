{% comment %}
  Privacy-respecting social share links (no tracking scripts).
  Uses simple URL-based sharing — no JavaScript widgets.
{% endcomment %}
{% capture share_text %}{{ page.title }}: {{ page.url | absolute_url }}{% endcapture %}
<div class="social-share" aria-label="Share this page">
  <span class="share-label">Share:</span>
  <a href="mailto:?subject={{ page.title | uri_escape }}&body={{ page.url | absolute_url | uri_escape }}" aria-label="Share via email" class="share-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    Email
  </a>
  <a href="https://bsky.app/intent/compose?text={{ share_text | strip | uri_escape }}" aria-label="Share on Bluesky" class="share-link">Bluesky</a>
  <button type="button" class="share-link share-copy" data-share-url="{{ page.url | absolute_url }}" hidden>Copy link</button>
</div>
