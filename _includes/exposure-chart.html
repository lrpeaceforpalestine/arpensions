{% assign inv = site.data.investigation %}
{% assign treasury = inv.agencies | where: "id", "treasury" | first %}
{% assign apers = inv.agencies | where: "id", "apers" | first %}
{% assign atrs = inv.agencies | where: "id", "atrs" | first %}
<figure class="exposure-ledger" data-investigation-chart>
  <figcaption>
    <span class="section-label">Different measures, shown separately</span>
    <strong>Documented amounts by institution and transaction state</strong>
  </figcaption>
  <div class="exposure-bars" aria-hidden="true">
    <div class="exposure-row">
      <span class="exposure-label">Treasury securities</span>
      <span class="exposure-track"><span class="exposure-bar exposure-bar--established" style="--bar-value: {{ treasury.measure_millions }}%">${{ treasury.measure_millions }}M</span><span class="exposure-bar exposure-bar--conditional" style="--bar-value: {{ inv.metrics.treasury_conditional_payment.value_millions }}%">{{ inv.metrics.treasury_conditional_payment.display }}</span></span>
    </div>
    <div class="exposure-row">
      <span class="exposure-label">APERS security</span>
      <span class="exposure-track"><span class="exposure-bar exposure-bar--established" style="--bar-value: {{ apers.measure_millions }}%">${{ apers.measure_millions }}M</span></span>
    </div>
    <div class="exposure-row">
      <span class="exposure-label">ATRS manager funding</span>
      <span class="exposure-track"><span class="exposure-bar exposure-bar--funded" style="--bar-value: {{ atrs.measure_millions }}%">${{ atrs.measure_millions }}M</span></span>
    </div>
  </div>
  <div class="table-scroll" tabindex="0" role="region" aria-label="Documented amounts table">
    <table class="exposure-table">
      <thead><tr><th>Institution</th><th>Amount</th><th>Measure</th><th>Status</th></tr></thead>
      <tbody>
        <tr><th scope="row">State Treasury</th><td>${{ treasury.measure_millions }}M</td><td>Derived security-level floor</td><td>Established</td></tr>
        <tr><th scope="row">APERS</th><td>${{ apers.measure_millions }}M</td><td>Confirmed security purchase</td><td>Established</td></tr>
        <tr><th scope="row">ATRS</th><td>${{ atrs.measure_millions }}M</td><td>Funding to Reams manager mandate</td><td>Funded mandate</td></tr>
        <tr><th scope="row">State Treasury</th><td>{{ inv.metrics.treasury_conditional_payment.display }}</td><td>Payment instruction marked “Processing By Bank”</td><td>Conditional</td></tr>
      </tbody>
    </table>
  </div>
  <p class="figure-note">Scale is $1 million per percentage point. The ATRS bar represents manager funding, not identified security holdings. The outlined Treasury segment is conditional.</p>
</figure>
