<!-- CSP: sha256 hash whitelists the anti-FOUC inline script below.
     If you change the script content, recompute with:
     node -e "const c=require('crypto');const s=`SCRIPT_CONTENT`;console.log(c.createHash('sha256').update(s,'utf8').digest('base64'))" -->
{% if page.url == "/take-action/" %}
<!-- Take Action only: relax CSP for the Action Network petition embed. AN loads
     scripts from actionnetwork.org AND injects an inline script, so script-src
     needs actionnetwork.org plus 'unsafe-inline'. The anti-FOUC sha256 hash is
     dropped on THIS page only — a hash and 'unsafe-inline' cancel each other,
     and 'unsafe-inline' covers both our inline script and AN's. Scoped here;
     every other page keeps the strict hash-based policy. No reCAPTCHA/Google.
     This trusts AN's whole origin — the inherent third-party-embed trade-off;
     do not widen further without cause. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://actionnetwork.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://actionnetwork.org; font-src https://fonts.gstatic.com; img-src 'self' data: https://actionnetwork.org; connect-src 'self' https://actionnetwork.org; form-action 'self' https://actionnetwork.org; object-src 'none';">
{% else %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-A2OjEGCbS6qImIS66ELxAVHhQOxctdwT3zDdCpT2g/M=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none';">
{% endif %}

<!-- Anti-FOUC: set theme + color-scheme + background/color before any rendering.
     Also creates an exact-match <meta name="color-scheme"> dynamically
     (the static meta was removed — it caused a flash by telling the browser
     "use OS preference" before the script could correct it).
     Reads the current 'api-theme' key first, then falls back to the legacy
     'art-theme' key so returning visitors keep their saved preference on
     first paint after the rename. theme-toggle.js completes the migration.
     CSP hash: sha256-A2OjEGCbS6qImIS66ELxAVHhQOxctdwT3zDdCpT2g/M= -->
<script>(function(){var d=document.documentElement;var t=localStorage.getItem('api-theme')||localStorage.getItem('art-theme');if(t!=='dark'&&t!=='light')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);d.style.colorScheme=t;d.style.backgroundColor=t==='dark'?'#013237':'#FFFFFF';d.style.color=t==='dark'?'#E6F9E4':'#152019';var m=document.createElement('meta');m.name='color-scheme';m.content=t;document.head.appendChild(m)})()</script>
<!-- Critical paint: prevents flash while external CSS loads.
     Covers BOTH themes, backgrounds for all visible elements, logo swap.
     Values hardcoded — keep in sync with main.css tokens. -->
<style>
html[data-theme="dark"]{color-scheme:dark;background-color:#013237;color:#E6F9E4}
html[data-theme="light"]{color-scheme:light;background-color:#FFFFFF;color:#152019}
html[data-theme="dark"] body{background-color:#013237}
html[data-theme="light"] body{background-color:#FFFFFF}
html[data-theme="dark"] .site-nav{background:#074750}
html[data-theme="light"] .site-nav{background:#F2FAF1}
html[data-theme="dark"] .site-footer{background:#001E22}
html[data-theme="light"] .site-footer{background:#013237}
html[data-theme="dark"] main{background-color:#013237}
html[data-theme="light"] main{background-color:#FFFFFF}
html[data-theme="dark"] .mobile-cta-bar{background:#074750}
html[data-theme="light"] .mobile-cta-bar{background:#FFFFFF}
.nav-logo-mark{position:relative;display:inline-block;width:44px;height:44px;flex-shrink:0}
.logo-dark{position:absolute;top:0;left:0;pointer-events:none}
[data-theme="dark"] .logo-light,[data-theme="light"] .logo-dark,:root:not([data-theme]) .logo-dark{opacity:0}
[data-theme="dark"] .logo-dark,[data-theme="light"] .logo-light{opacity:1}
html[data-theme="dark"] :where(main,footer,aside,section,article,div){background-color:transparent}
/* ADD NEW THEMED COMPONENTS IN ALL THREE LOCATIONS: base pairs above, @media dark block, and @media light block */
html[data-theme="light"] .hero{background-color:#013237}
html[data-theme="dark"] .hero{background-color:#001E22}
html[data-theme="light"] .hero-band{background:#013237}
html[data-theme="dark"] .hero-band{background:#001E22}
html[data-theme="light"] .pathways{background:#FFFFFF}
html[data-theme="dark"] .pathways{background:#013237}
html[data-theme="light"] .audience-cards{background:#F2FAF1}
html[data-theme="dark"] .audience-cards{background:#074750}
html[data-theme="light"] .stats-bar{background:#FFFFFF;border-color:#DCE8DC}
html[data-theme="dark"] .stats-bar{background:#074750;border-color:#14555C}
html[data-theme="light"] .page-header-band{background:#F2FAF1}
html[data-theme="dark"] .page-header-band{background:#074750}
html[data-theme="light"] .evidence-toc-sidebar{background:#FFFFFF}
html[data-theme="dark"] .evidence-toc-sidebar{background:#013237}
html[data-theme="light"] .callout{background:rgba(72,164,109,0.08)}
html[data-theme="dark"] .callout{background:rgba(95,191,139,0.12)}
html[data-theme="light"] .cta-box{background:#F2FAF1}
html[data-theme="dark"] .cta-box{background:#074750}
html[data-theme="light"] .issue-principle{background:#F2FAF1}
html[data-theme="dark"] .issue-principle{background:#074750}
html[data-theme="light"] .about-section{background:#F2FAF1}
html[data-theme="dark"] .about-section{background:#074750}
/* Neutralize Pico's @media (prefers-color-scheme: dark) when site theme disagrees */
@media (prefers-color-scheme: dark) {
  html[data-theme="light"] { color-scheme: light !important; background: #FFFFFF !important; color: #152019 !important; }
  html[data-theme="light"] body { background: #FFFFFF !important; }
  html[data-theme="light"] main { background: #FFFFFF !important; }
  html[data-theme="light"] .site-nav { background: #F2FAF1 !important; }
  html[data-theme="light"] .site-footer { background: #013237 !important; }
  html[data-theme="light"] .mobile-cta-bar { background: #FFFFFF !important; }
  html[data-theme="light"] .stats-bar { background: #FFFFFF !important; border-color: #DCE8DC !important; }
  html[data-theme="light"] .page-header-band { background: #F2FAF1 !important; }
  html[data-theme="light"] .evidence-toc-sidebar { background: #FFFFFF !important; }
  html[data-theme="light"] .callout { background: rgba(72,164,109,0.08) !important; }
  html[data-theme="light"] .cta-box { background: #F2FAF1 !important; }
  html[data-theme="light"] .issue-principle { background: #F2FAF1 !important; }
  html[data-theme="light"] .about-section { background: #F2FAF1 !important; }
}
@media (prefers-color-scheme: light) {
  html[data-theme="dark"] { color-scheme: dark !important; background: #013237 !important; color: #E6F9E4 !important; }
  html[data-theme="dark"] body { background: #013237 !important; }
  html[data-theme="dark"] main { background: #013237 !important; }
  html[data-theme="dark"] .site-nav { background: #074750 !important; }
  html[data-theme="dark"] .site-footer { background: #001E22 !important; }
  html[data-theme="dark"] .mobile-cta-bar { background: #074750 !important; }
  html[data-theme="dark"] .stats-bar { background: #074750 !important; border-color: #14555C !important; }
  html[data-theme="dark"] .page-header-band { background: #074750 !important; }
  html[data-theme="dark"] .evidence-toc-sidebar { background: #013237 !important; }
  html[data-theme="dark"] .callout { background: rgba(95,191,139,0.12) !important; }
  html[data-theme="dark"] .cta-box { background: #074750 !important; }
  html[data-theme="dark"] .issue-principle { background: #074750 !important; }
  html[data-theme="dark"] .about-section { background: #074750 !important; }
}
@view-transition{navigation:auto}
</style>
