{% assign inv = site.data.investigation %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NGO",
  "@id": "https://arpensions.org/#organization",
  "name": "Arkansans for Pension Integrity",
  "url": "https://arpensions.org",
  "email": "info@arpensions.org",
  "logo": {
    "@type": "ImageObject",
    "url": "https://arpensions.org/assets/images/api-badge-512.png",
    "width": 512,
    "height": 512
  },
  "description": "Arkansas campaign for documented, issuer-neutral pension investment safeguards and fiduciary accountability.",
  "areaServed": {"@type": "AdministrativeArea", "name": "Arkansas"},
  "knowsAbout": ["pension integrity", "Arkansas public records", "fiduciary duty", "state pension funds", "non-marketable sovereign debt"]
}
</script>

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://arpensions.org/#website",
  "url": "https://arpensions.org",
  "name": "Arkansans for Pension Integrity",
  "description": {{ inv.thesis.summary | jsonify }},
  "inLanguage": "en-US",
  "publisher": {"@id": "https://arpensions.org/#organization"}
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://arpensions.org/"},
    {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
{% endif %}

{% if page.url == "/evidence/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Report",
  "@id": "https://arpensions.org/evidence/#report",
  "name": "Arkansas Public Investment Record",
  "url": "https://arpensions.org/evidence/",
  "dateModified": {{ inv.updated_at | jsonify }},
  "description": {{ inv.analysis_record.lead | jsonify }},
  "publisher": {"@id": "https://arpensions.org/#organization"},
  "inLanguage": "en-US"
}
</script>
{% endif %}
