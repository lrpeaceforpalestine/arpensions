    "@type": "ImageObject",
    "@id": "https://arpensions.org/#logo",

    "width": 512,

    "caption": "Arkansans for Pension Integrity logo"

  "description": "A statewide campaign for transparent, financially sound stewardship of Arkansas public retirement money.",

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://arpensions.org/#website",
  "url": "https://arpensions.org/",
  "name": "Arkansans for Pension Integrity",
  "description": "Public money deserves a public investment record.",
  "inLanguage": "en-US",
  "publisher": { "@id": "https://arpensions.org/#organization" }
}
</script>
{% endif %}

{% unless page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://arpensions.org/"
    }{% if page.layout == "post" %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Campaign Updates",
      "item": "https://arpensions.org/news/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }}
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }}
    }{% endif %}
  ]
}
</script>
{% endunless %}

{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": { "@id": "https://arpensions.org/#organization" },
  "publisher": { "@id": "https://arpensions.org/#organization" },
  "image": "https://arpensions.org/assets/images/og-default.png",
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" }
}
</script>
{% endif %}

{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What prompted Arkansans for Pension Integrity?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Arkansas agencies put public money into completed Israel Bonds purchases or an ATRS manager account created for the strategy. Pension members should be able to see a clear financial explanation tied to each covered decision."
      }
    },
    {
      "@type": "Question",
      "name": "Who makes the final investment decision?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pension trustees retain their full investment authority. The proposal adds a written financial analysis and public posting after a covered purchase."
      }
    },
    {
      "@type": "Question",
      "name": "How broadly would the proposal apply?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The same requirements would apply to every covered purchase of non-tradable sovereign debt, regardless of issuer. The Arkansas Israel Bonds decisions show why this statewide rule is needed."
      }
    },
    {
      "@type": "Question",
      "name": "Why does process matter if the amounts are a small part of each portfolio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A consistent written process protects members across every investment decision, builds confidence, and makes it possible to evaluate the financial trade-offs."
      }
    },
    {
      "@type": "Question",
      "name": "How can I help?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Visit the Take Action page to support the Integrity Act, contact Arkansas legislators, attend a pension board meeting, or volunteer."
      }
    }
  ]
}
</script>
{% endif %}

<script type="application/ld+json">

  "publisher": { "@id": "https://arpensions.org/#organization" },
  "about": ["Arkansas pension systems", "Israel Bonds", "fiduciary duty", "non-tradable sovereign debt"],
  "inLanguage": "en-US"
}
</script>
{% endif %}
