{% assign inv = site.data.investigation %}
<div class="agency-status-grid">
  {% for agency in inv.agencies %}
  <article class="agency-status-card" id="agency-{{ agency.id }}">
    <header>
      <span class="evidence-status evidence-status--{{ agency.status | replace: ' ', '-' }}">{{ agency.status }}</span>
      <h3>{{ agency.short_name }}</h3>
      <p class="agency-status-name">{{ agency.name }}</p>
    </header>
    <dl>
      <div><dt>Authority</dt><dd>{{ agency.authorization }}</dd></div>
      <div><dt>Documented measure</dt><dd>{{ agency.measure }}</dd></div>
    </dl>
    <p>{{ agency.record }}</p>
    <p class="evidence-boundary"><strong>Record boundary:</strong> {{ agency.boundary }}</p>
  </article>
  {% endfor %}
</div>
