version: 2
updates:
  # Keep the GitHub Actions used by the CI workflows patched.
  # Scoped to github-actions only: the site's Ruby gems are pinned by the
  # github-pages gem, so a bundler updater would only create conflicts.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
