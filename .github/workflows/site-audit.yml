name: Site accuracy and accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit source and canonical evidence
        run: python scripts/audit_site.py

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Audit rendered HTML, links, metadata, and fallbacks
        run: python scripts/audit_site.py --site _site

      - name: Verify source excerpts, QR payload, and social image
        run: python scripts/verify_assets.py
